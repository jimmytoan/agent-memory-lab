[project]
name = "agent-memory-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic<1",
    "graphiti-core[anthropic]>=0.31.2",
    "httpx>=0.28.1",
    "letta-client>=1.12.1",
    "mem0ai[nlp]>=2.2.1",
    "openai>=3.51.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "starlette>=1.10.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
